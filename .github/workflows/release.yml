jobs:
  verify-tag:
    name: Verify tag against pubspec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      build_code: ${{ steps.check.outputs.build-code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Check version
        id: check
        run: |
          set -euo pipefail
          raw=$(grep -E '^version:' app/pubspec.yaml | awk '{print $2}')
          name=${raw%%+*}
          code=${raw##*+}
          tag='${{ inputs.tag || github.ref_name }}'
          expected="v${name}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag $tag does not match pubspec version $raw (expected $expected)"
            exit 1
          fi
          if ! [[ "$code" =~ ^[0-9]+$ ]]; then
            echo "::error::version code '$code' in pubspec is not a number; Android requires an integer that increases"
            exit 1
          fi
          echo "tag $tag matches pubspec $raw"
          echo "version=${name}" >> "$GITHUB_OUTPUT"
          echo "build-code=${code}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build and publish release APK
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
