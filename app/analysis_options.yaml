# Analysis options for the Flutter app.
#
# Matches the two packages' `analysis_options.yaml`, which are strict about
# types. The app was previously on the stock `flutter create` config, which meant
# app code was not held to the same bar as the domain layer - and several
# annotation bugs reached runtime that a `strict-inference` pass would have
# flagged. Kept aligned deliberately; a divergence here is easy not to notice.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Surface stray TODOs. The packages already do this.
    todo: warning

linter:
  rules:
    # Flutter keeps its own set on top of these; anything already implied by
    # flutter_lints is not repeated here.
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_positional_boolean_parameters
    - avoid_slow_async_io
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - require_trailing_commas
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unawaited_futures
    - use_super_parameters

    # Beyond the packages' config, because the widget layer has failure modes
    # the pure Dart layer cannot:
    # An unawaited build() or dispose() in a State is a leak, and the analyzer
    # cannot infer the lifecycle intent from a bare call.
    - cancel_subscriptions
    - close_sinks
    # Padding with EdgeInsets is nearly always meant to be symmetric.
    - use_full_hex_values_for_flutter_colors
    # `BuildContext` used after an await is the classic async-gap bug.
    - use_build_context_synchronously
    # setState called from an async gap without a mounted check.