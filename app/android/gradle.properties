org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Gradle's local build cache lives at ~/.gradle/caches/build-cache-1, which is
# already inside the tree `actions/setup-java`'s `cache: gradle` preserves, so
# enabling it needs no new cache step. Without this line nothing is ever
# written there and every CI run recompiles from scratch.
#
# Measured on the `Build debug APK` job (Flutter 3.47.5, Gradle 9.1.0):
# assembleDebug takes 110.2s, of which 13.6s is the NDK 28.2 side-by-side
# install and the remaining ~98s is gradle work worth reusing. That is why this
# is the cache that pays and the NDK is not: caching the NDK means pushing
# ~2.9GB through actions/cache to save a 13.6s download, which is slower than
# the download it replaces.
#
# Deliberately not `org.gradle.configuration-cache`: the Flutter Gradle plugin
# is not compatible with it.
org.gradle.caching=true
