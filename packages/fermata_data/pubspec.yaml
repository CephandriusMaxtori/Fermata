name: fermata_data
description: >-
  Drift-backed persistence and on-device file storage for Fermata. Pure Dart:
  the host app supplies the QueryExecutor, which keeps this package testable
  with `dart test` and free of any Flutter dependency.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.6
  drift: ^2.35.0
  path: ^1.9.0
  sqlite3: ^3.0.0
  fermata_core:
    path: ../fermata_core

dev_dependencies:
  build_runner: ^2.4.14
  drift_dev: ^2.35.0
  lints: ^6.0.0
  test: ^1.25.0
